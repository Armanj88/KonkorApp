<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light dark}body{margin:0}</style>
<title>جدول تناوبی</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: standard 18-column table on a horizontally scrollable grid; element sheet slides up from the bottom on phones and centers on wide screens. */
:root {
  --bg: #eef1f5;
  --panel: #ffffff;
  --ink: #15212e;
  --ink-2: #4a5a6b;
  --line: #d3dae2;
  --accent: #1b5fd1;
  --accent-ink: #ffffff;
  --danger: #b3261e;
  --cs: 60%;
  --cl: 90%;
  --cb: 62%;
  --ctext: #15212e;
  --font: "Vazirmatn", "Segoe UI", Tahoma, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1720;
    --panel: #17212c;
    --ink: #e6ecf2;
    --ink-2: #9aa9b8;
    --line: #2a3846;
    --accent: #6fa2ff;
    --accent-ink: #0b1220;
    --danger: #ff8a80;
    --cs: 38%;
    --cl: 24%;
    --cb: 42%;
    --ctext: #eaf0f6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1720;
  --panel: #17212c;
  --ink: #e6ecf2;
  --ink-2: #9aa9b8;
  --line: #2a3846;
  --accent: #6fa2ff;
  --accent-ink: #0b1220;
  --danger: #ff8a80;
  --cs: 38%;
  --cl: 24%;
  --cb: 42%;
  --ctext: #eaf0f6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.7;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; }
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; margin-bottom: 18px; }
.top h1 { margin: 0; font-size: 1.75rem; font-weight: 800; text-wrap: balance; line-height: 1.3; }
.top p { margin: 4px 0 0; color: var(--ink-2); font-size: .95rem; max-width: 46ch; }
.count { color: var(--ink-2); font-size: .85rem; }
.count b { color: var(--ink); font-weight: 700; }

.scroller { direction: ltr; overflow-x: auto; padding-bottom: 8px; }
.grid {
  direction: ltr;
  display: grid;
  grid-template-columns: repeat(18, minmax(38px, 1fr));
  grid-template-rows: repeat(7, auto) 14px auto auto;
  gap: 3px;
  min-width: 700px;
}
.el {
  grid-column: var(--col);
  grid-row: var(--row);
  position: relative;
  aspect-ratio: 1 / 1.08;
  min-width: 0;
  padding: 2px 1px 3px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: hsl(var(--h) var(--cs) var(--cl));
  border: 1px solid hsl(var(--h) 40% var(--cb));
  color: var(--ctext);
  border-radius: 5px;
  cursor: pointer;
  transition: transform .12s ease, opacity .15s ease, box-shadow .12s ease;
}
.el:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(10, 20, 35, .18); z-index: 2; }
.el .z { position: absolute; top: 2px; left: 4px; font: 500 .56rem var(--mono); opacity: .75; }
.el .s { font: 600 1.02rem var(--mono); line-height: 1.1; }
.el .n { display: none; font-size: .56rem; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; }
.el .dot { position: absolute; top: 3px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.el[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.grid.filtering .el:not(.on) { opacity: .22; }
@media (min-width: 820px) {
  .el .n { display: block; }
  .el .s { font-size: 1.15rem; }
}

.ph {
  grid-column: 3; grid-row: var(--row);
  display: flex; align-items: center; justify-content: center;
  border: 1px dashed var(--line); border-radius: 5px;
  font: 500 .6rem var(--mono); color: var(--ink-2);
}
.rowlabel {
  grid-column: 1 / 3; grid-row: var(--row);
  align-self: center; justify-self: end;
  font-size: .72rem; color: var(--ink-2); direction: rtl; padding-inline: 4px;
}
.legend { direction: rtl; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }
.chip.go { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.catmem, .catnotes { margin-top: 18px; }
.members { display: flex; flex-wrap: wrap; gap: 6px; direction: ltr; justify-content: flex-end; }
.mem { font: 600 .82rem var(--mono); padding: 5px 9px; border-radius: 6px; cursor: pointer; background: hsl(var(--h) var(--cs) var(--cl)); border: 1px solid hsl(var(--h) 40% var(--cb)); color: var(--ctext); }
button.fact { text-align: right; background: transparent; cursor: pointer; font: inherit; color: inherit; width: 100%; }
.fact .go { font-size: .72rem; color: var(--accent); margin-top: 2px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .76rem; line-height: 1;
  padding: 6px 9px; border-radius: 99px; cursor: pointer;
  background: transparent; border: 1px solid var(--line);
}
.chip i { width: 10px; height: 10px; border-radius: 3px; background: hsl(var(--h) var(--cs) var(--cl)); border: 1px solid hsl(var(--h) 40% var(--cb)); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.hint { width: 100%; font-size: .8rem; color: var(--ink-2); margin: 0 0 4px; }

/* Element sheet */
.sheet[hidden] { display: none; }
.sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: rgba(8, 14, 22, .5); }
.panel {
  position: relative; width: 100%; max-width: 560px; max-height: 88dvh; overflow-y: auto;
  background: var(--panel); color: var(--ink);
  border-radius: 16px 16px 0 0;
  padding: 18px 20px 20px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  box-shadow: 0 -8px 30px rgba(0, 0, 0, .25);
  animation: rise .2s ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } .el { transition: none; } }
@media (min-width: 700px) {
  .sheet { align-items: center; }
  .panel { border-radius: 16px; }
}
.ph-head { display: flex; align-items: center; gap: 14px; }
.tile {
  flex: none; width: 76px; height: 82px; position: relative;
  display: flex; align-items: center; justify-content: center;
  background: hsl(var(--h) var(--cs) var(--cl)); border: 1px solid hsl(var(--h) 40% var(--cb));
  border-radius: 8px; color: var(--ctext); direction: ltr;
}
.tile .z { position: absolute; top: 4px; left: 7px; font: 500 .75rem var(--mono); opacity: .8; }
.tile .s { font: 600 2.1rem var(--mono); }
.ttl { min-width: 0; flex: 1; }
.ttl h2 { margin: 0; font-size: 1.5rem; font-weight: 800; line-height: 1.3; }
.ttl .en { color: var(--ink-2); font: 500 .85rem var(--mono); direction: ltr; text-align: right; }
.x {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 1.1rem; line-height: 1;
}
.cfg { margin-top: 18px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; }
.lab { font-size: .78rem; color: var(--ink-2); letter-spacing: .02em; margin: 0 0 4px; }
.cfg .short { direction: ltr; text-align: left; font: 600 1.25rem var(--mono); line-height: 1.5; overflow-wrap: anywhere; }
.cfg .full { direction: ltr; text-align: left; font: 500 .82rem var(--mono); color: var(--ink-2); margin-top: 6px; overflow-wrap: anywhere; }
.cfg sup { font-size: .65em; line-height: 0; }
.cfg .core { color: var(--accent); }
.note-pred { font-size: .78rem; color: var(--ink-2); margin: 8px 0 0; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 10px; }
.fact { padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.fact .v { font-weight: 700; font-size: 1.15rem; }
.fact .v.sm { font-size: .98rem; }

.notes { margin-top: 22px; }
.notes h3 { margin: 0 0 8px; font-size: 1.05rem; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.notes h3 small { font-weight: 400; color: var(--ink-2); font-size: .78rem; }
.nlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.nitem { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; }
.nitem .body { flex: 1; min-width: 0; }
.nitem .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.nitem .when { font-size: .72rem; color: var(--ink-2); margin-top: 2px; }
.del { flex: none; font-size: .78rem; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--ink-2); }
.del.sure { border-color: var(--danger); color: var(--danger); }
.empty { padding: 16px; border: 1px dashed var(--line); border-radius: 10px; color: var(--ink-2); font-size: .92rem; }
.add { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.add textarea {
  width: 100%; min-height: 76px; resize: vertical; font: inherit; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
.add .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.btn { font-weight: 700; font-size: .95rem; padding: 9px 20px; border-radius: 10px; border: 0; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: default; }
.msg { font-size: .8rem; color: var(--ink-2); }
.msg.err { color: var(--danger); }
</style>
</head>
<body>
<div class="wrap" dir="rtl" lang="fa">
  <div class="top">
    <div>
      <h1>جدول تناوبی</h1>
      <p>روی هر عنصر بزن تا آرایش الکترونی، گروه، دوره و نکته‌هایی که خودت نوشته‌ای را ببینی.</p>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div class="scroller"><div class="grid" id="grid"></div></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="backdrop" id="backdrop"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sh-title" dir="rtl" lang="fa">
    <div class="ph-head">
      <div class="tile" id="sh-tile"><span class="z" id="sh-z"></span><span class="s" id="sh-s"></span></div>
      <div class="ttl"><h2 id="sh-title"></h2><div class="en" id="sh-en"></div></div>
      <button class="x" id="sh-close" aria-label="بستن">&#x2715;</button>
    </div>
    <div class="cfg" id="sh-cfg">
      <p class="lab">آرایش الکترونی</p>
      <div class="short" id="sh-short"></div>
      <div class="full" id="sh-full"></div>
      <p class="note-pred" id="sh-pred" hidden>برای این عنصر آرایش الکترونی پیش‌بینی شده است و اندازه‌گیری تجربی کامل در دسترس نیست.</p>
    </div>
    <div class="facts" id="sh-facts">
      <div class="fact"><p class="lab">گروه</p><div class="v" id="sh-group"></div></div>
      <div class="fact"><p class="lab">دوره</p><div class="v" id="sh-period"></div></div>
      <button type="button" class="fact" id="sh-cat-btn"><p class="lab">دسته</p><div class="v sm" id="sh-cat"></div><div class="go">نکته‌های دسته</div></button>
    </div>
    <section class="catmem" id="sh-members" hidden>
      <p class="lab">عنصرهای این دسته</p>
      <div class="members" id="sh-members-list"></div>
    </section>
    <section class="catnotes" id="sh-catnotes" hidden>
      <p class="lab" id="sh-catnotes-title"></p>
      <ul class="nlist" id="sh-catnotes-list"></ul>
    </section>
    <section class="notes">
      <h3>نکته‌ها <small id="sh-store"></small></h3>
      <ul class="nlist" id="sh-notes"></ul>
      <form class="add" id="add-form">
        <label class="lab" for="note-input">نکته جدید</label>
        <textarea id="note-input" placeholder="مثلاً: استثنای آرایش الکترونی، کاربرد، روش حفظ کردن..."></textarea>
        <div class="row">
          <span class="msg" id="add-msg" role="status"></span>
          <button class="btn" id="add-btn" type="submit" disabled>افزودن نکته</button>
        </div>
      </form>
    </section>
  </div>
</div>

<script>
(function () {
  var SYM = "H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og".split(" ");
  var EN = "Hydrogen,Helium,Lithium,Beryllium,Boron,Carbon,Nitrogen,Oxygen,Fluorine,Neon,Sodium,Magnesium,Aluminium,Silicon,Phosphorus,Sulfur,Chlorine,Argon,Potassium,Calcium,Scandium,Titanium,Vanadium,Chromium,Manganese,Iron,Cobalt,Nickel,Copper,Zinc,Gallium,Germanium,Arsenic,Selenium,Bromine,Krypton,Rubidium,Strontium,Yttrium,Zirconium,Niobium,Molybdenum,Technetium,Ruthenium,Rhodium,Palladium,Silver,Cadmium,Indium,Tin,Antimony,Tellurium,Iodine,Xenon,Caesium,Barium,Lanthanum,Cerium,Praseodymium,Neodymium,Promethium,Samarium,Europium,Gadolinium,Terbium,Dysprosium,Holmium,Erbium,Thulium,Ytterbium,Lutetium,Hafnium,Tantalum,Tungsten,Rhenium,Osmium,Iridium,Platinum,Gold,Mercury,Thallium,Lead,Bismuth,Polonium,Astatine,Radon,Francium,Radium,Actinium,Thorium,Protactinium,Uranium,Neptunium,Plutonium,Americium,Curium,Berkelium,Californium,Einsteinium,Fermium,Mendelevium,Nobelium,Lawrencium,Rutherfordium,Dubnium,Seaborgium,Bohrium,Hassium,Meitnerium,Darmstadtium,Roentgenium,Copernicium,Nihonium,Flerovium,Moscovium,Livermorium,Tennessine,Oganesson".split(",");

  var CATS = {

  };
  function catOf(z) {
    if ([3, 11, 19, 37, 55, 87].indexOf(z) >= 0) return "alkali";
    if ([4, 12, 20, 38, 56, 88].indexOf(z) >= 0) return "alkaline";
    if (z >= 57 && z <= 71) return "lanth";
    if (z >= 89 && z <= 103) return "actin";
    if ([2, 10, 18, 36, 54, 86, 118].indexOf(z) >= 0) return "noble";
    if ([9, 17, 35, 53, 85, 117].indexOf(z) >= 0) return "halogen";
    if ([5, 14, 32, 33, 51, 52].indexOf(z) >= 0) return "metalloid";
    if ([1, 6, 7, 8, 15, 16, 34].indexOf(z) >= 0) return "nonmetal";
    if ([13, 31, 49, 50, 81, 82, 83, 84, 113, 114, 115, 116].indexOf(z) >= 0) return "post";

  }

  function pos(z) {
    var r, c;
    if (z === 1) { r = 1; c = 1; }
    else if (z === 2) { r = 1; c = 18; }
    else if (z <= 4) { r = 2; c = z - 2; }

    }
    if (useExc && EXC[z]) {
      for (var key in EXC[z]) { if (EXC[z][key] === 0) delete occ[key]; else occ[key] = EXC[z][key]; }
    }
    return occ;
  }
  function sortKeys(keys) {
    return keys.sort(function (a, b) {
      var na = +a[0], nb = +b[0];
      return na !== nb ? na - nb : LET.indexOf(a[1]) - LET.indexOf(b[1]);
    });
  }
  function fmt(keys, occ) {
    return keys.map(function (k) { return k + "<sup>" + occ[k] + "</sup>"; }).join(" ");
  }
  function config(z) {
    var occ = fill(z, true), keys = sortKeys(Object.keys(occ));
    var full = fmt(keys, occ), short = full, core = null;
    if (z > 2) {
      for (var i = 0; i < NOBLE.length; i++) {
        if (NOBLE[i][0] < z) { core = NOBLE[i]; break; }
      }
      var coreKeys = Object.keys(fill(core[0], false));
      var rest = sortKeys(keys.filter(function (k) { return coreKeys.indexOf(k) < 0; }));
      short = '<span class="core">[' + core[1] + ']</span> ' + fmt(rest, occ);
    }
    return { short: short, full: full };
  }

  var $ = function (id) { return document.getElementById(id); };
  var faNum = function (n) { return Number(n).toLocaleString("fa-IR", { useGrouping: false }); };

  var grid = $("grid");
  var cellEls = {};
  var activeCat = null;

  // Legend
  var legend = document.createElement("div");
  legend.className = "legend";
  legend.innerHTML = '<p class="hint">برای دیدن یک دسته، روی آن بزن.</p>';
  Object.keys(CATS).forEach(function (k) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", "false");
    b.style.setProperty("--h", CATS[k].h);
    b.innerHTML = "<i></i>" + CATS[k].name;
    b.addEventListener("click", function () {
      activeCat = activeCat === k ? null : k;
      applyFilter();
    });
    b.dataset.cat = k;
    legend.appendChild(b);
  });
  var catbtn = document.createElement("button");
  catbtn.type = "button"; catbtn.className = "chip go"; catbtn.hidden = true;
  catbtn.addEventListener("click", function () { if (activeCat) openCat(activeCat); });
  legend.appendChild(catbtn);
  var scroller = document.querySelector(".scroller");
  scroller.parentNode.insertBefore(legend, scroller);

  function updateCatBtn() {
    catbtn.hidden = !activeCat;
    if (activeCat) {
      var n = (notes["cat-" + activeCat] || []).length;
      catbtn.textContent = "نکته‌های " + CATS[activeCat].name + (n ? " (" + faNum(n) + ")" : "");
    }
  }

  function applyFilter() {
    updateCatBtn();
    grid.classList.toggle("filtering", !!activeCat);
    Array.prototype.forEach.call(legend.querySelectorAll(".chip"), function (c) {
      c.setAttribute("aria-pressed", String(c.dataset.cat === activeCat));
    });
    Object.keys(cellEls).forEach(function (z) {
      cellEls[z].classList.toggle("on", !!activeCat && cellEls[z].dataset.cat === activeCat);
    });
  }

  function addPh(row, text) {
    var d = document.createElement("div");
    d.className = "ph"; d.style.setProperty("--row", row); d.textContent = text;
    grid.appendChild(d);
  }
  addPh(6, "57–71"); addPh(7, "89–103");
  function addLabel(row, text) {
    var d = document.createElement("div");
    d.className = "rowlabel"; d.style.setProperty("--row", row); d.textContent = text;
    grid.appendChild(d);
  }
  addLabel(9, "لانتانیدها"); addLabel(10, "آکتینیدها");

  for (var z = 1; z <= 118; z++) {
    (function (z) {
      var p = pos(z), cat = catOf(z);
      var b = document.createElement("button");
      b.type = "button"; b.className = "el"; b.dataset.cat = cat; b.dataset.z = z;
      b.setAttribute("aria-pressed", "false");
      b.setAttribute("aria-label", FA[z - 1] + "، عنصر " + z);
      b.style.setProperty("--h", CATS[cat].h);
      b.style.setProperty("--row", p.row);
      b.style.setProperty("--col", p.col);
      b.innerHTML = '<span class="z">' + z + '</span><span class="s">' + SYM[z - 1] + '</span><span class="n">' + FA[z - 1] + "</span>";
      b.addEventListener("click", function () { openSheet(z); });
      grid.appendChild(b);
      cellEls[z] = b;
    })(z);
  }

  // Notes storage
  var notes = {};
  var db = null;
  var mode = "local";
  var writeChain = Promise.resolve();
  var LS_KEY = "periodic-table-notes-v1";

  function lsRead() {
    try { var raw = localStorage.getItem(LS_KEY); if (raw) notes = JSON.parse(raw) || {}; } catch (e) {}
  }
  var lsOk = true;
  function lsWrite() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(notes)); lsOk = true; } catch (e) { lsOk = false; }
  }
  function storeLabel() {
    if (storeErr) return storeErr;
    if (mode === "db") return "";
    return lsOk ? "ذخیره در همین مرورگر" : "ذخیره‌سازی در این نما کار نمی‌کند";
  }
  var dirty = {}, failed = {}, firstSnap = true;
  function refreshDots() {
    var total = 0;
    Object.keys(cellEls).forEach(function (z) {
      var has = notes[z] && notes[z].length;
      var el = cellEls[z], dot = el.querySelector(".dot");
      if (has && !dot) { var d = document.createElement("span"); d.className = "dot"; el.appendChild(d); }
      if (!has && dot) dot.remove();
      if (has) total += notes[z].length;
    });
    Object.keys(CATS).forEach(function (k) { total += (notes["cat-" + k] || []).length; });
    updateCatBtn();
    $("count").innerHTML = total ? "<b>" + faNum(total) + "</b> نکته ذخیره شده" : "هنوز نکته‌ای ذخیره نشده";
  }
  var storeErr = "", pending = {}, loadTimer = null;
  var bridge = window.__konkorPt || null;
  var inFrame = !bridge && window.parent !== window;
  function bridgeSave(key, items) {
    if (bridge && typeof bridge.save === "function") {
      return Promise.resolve(bridge.save(key, items)).then(function (ok) { return !!ok; }).catch(function () { return false; });
    }
    return new Promise(function (res) {
      var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      pending[id] = res;
      window.parent.postMessage({ pt: "save", id: id, key: key, items: items }, location.origin);
      setTimeout(function () { if (pending[id]) { delete pending[id]; res(false); } }, 15000);
    });
  }
  function persist(z) {
    var items = notes[z] || [];
    if (mode === "db") {
      dirty[z] = (dirty[z] || 0) + 1;
      writeChain = writeChain.then(function () { return bridgeSave(z, items); }).then(function (ok) {
        dirty[z]--;
        if (ok) { delete failed[z]; } else { failed[z] = true; setMsg("ذخیره نشد. اتصال را بررسی کن و دوباره امتحان کن.", true); }
      });
      return writeChain;
    }
    lsWrite();
    if (!lsOk) setMsg("این نما اجازه ذخیره نمی‌دهد. نکته تا بستن صفحه می‌ماند. فایل را در مرورگر باز کن.", true);
    return Promise.resolve();
  }
  function onMsg(e) {
    if (e.origin !== location.origin || e.source !== window.parent) return;
    var m = e.data || {};
    if (m.pt === "saved") {
      var r = pending[m.id];
      if (r) { delete pending[m.id]; r(!!m.ok); }
    } else if (m.pt === "init") {
      clearTimeout(loadTimer);
      if (m.error) {
        mode = "local"; storeErr = "جدول نکته‌ها در Supabase ساخته نشده. نکته‌ها فقط در همین مرورگر می‌مانند.";
        lsRead();
      } else {
        mode = "db"; storeErr = "";
        var remote = m.notes || {};
        Object.keys(notes).forEach(function (k) { if (dirty[k] > 0 || failed[k]) remote[k] = notes[k]; });
        notes = remote;
      }
      $("sh-store").textContent = storeLabel();
      refreshDots();
      if (sheetKey != null) {
        renderNotes();
        if (typeof sheetKey === "number") renderCatNotes(catOf(sheetKey));
      }
    }
  }
  function startStore() {
    if (bridge) {
      refreshDots();
      if (typeof bridge.onReady === "function") bridge.onReady(function (payload) {
        onMsg({ origin: location.origin, source: window, data: { pt: "init", notes: (payload && payload.notes) || {}, error: payload && payload.error } });
      });
      return;
    }
    if (!inFrame) { lsRead(); refreshDots(); return; }
    window.addEventListener("message", onMsg);
    refreshDots();
    window.parent.postMessage({ pt: "ready" }, location.origin);
    loadTimer = setTimeout(function () { $("sh-store").textContent = "ذخیره‌سازی هنوز پاسخ نداده"; }, 10000);
  }

  // Sheet
  var sheet = $("sheet"), sheetKey = null, lastFocus = null, armed = null;

  function setMsg(t, err) {
    var m = $("add-msg"); m.textContent = t || ""; m.className = "msg" + (err ? " err" : "");
  }

  function showMode(isCat) {
    $("sh-cfg").hidden = isCat;
    $("sh-facts").hidden = isCat;
    $("sh-pred").hidden = true;
    $("sh-members").hidden = !isCat;
  }
  function titleFor(key) {
    return typeof key === "string" ? "دسته‌ی " + CATS[key.slice(4)].name : FA[key - 1];
  }
  function openSheet(z) {
    sheetKey = z; armed = null;
    var cat = catOf(z), p = pos(z), c = config(z);
    if (sheet.hidden) lastFocus = document.activeElement;
    showMode(false);
    $("sh-cat-btn").onclick = function () { openCat(cat); };
    Object.keys(cellEls).forEach(function (k) { cellEls[k].setAttribute("aria-pressed", String(+k === z)); });
    var tile = $("sh-tile");
    tile.style.setProperty("--h", CATS[cat].h);
    $("sh-z").textContent = z;
    $("sh-s").textContent = SYM[z - 1];
    $("sh-title").textContent = FA[z - 1];
    $("sh-en").textContent = EN[z - 1];
    $("sh-short").innerHTML = c.short;
    $("sh-full").innerHTML = z > 2 ? c.full : "";
    $("sh-pred").hidden = z < 104;
    $("sh-group").textContent = p.group ? faNum(p.group) : "بلوک f";
    $("sh-period").textContent = faNum(p.period);
    $("sh-cat").textContent = CATS[cat].name;
    $("sh-store").textContent = storeLabel();
    $("note-input").value = "";
    $("add-btn").disabled = true;
    setMsg("");
    renderNotes(); renderCatNotes(cat);
    sheet.hidden = false;
    sheet.querySelector(".panel").scrollTop = 0;
    document.body.style.overflow = "hidden";
    $("sh-close").focus();
  }
  function openCat(k) {
    sheetKey = "cat-" + k; armed = null;
    if (sheet.hidden) lastFocus = document.activeElement;
    showMode(true);
    Object.keys(cellEls).forEach(function (q) { cellEls[q].setAttribute("aria-pressed", "false"); });
    var zs = [];
    for (var i = 1; i <= 118; i++) if (catOf(i) === k) zs.push(i);
    $("sh-tile").style.setProperty("--h", CATS[k].h);
    $("sh-z").textContent = "عنصر";
    $("sh-s").textContent = zs.length;
    $("sh-title").textContent = CATS[k].name;
    $("sh-en").textContent = "";
    var mem = $("sh-members-list");
    mem.innerHTML = "";
    zs.forEach(function (z) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "mem"; b.style.setProperty("--h", CATS[k].h);
      b.textContent = SYM[z - 1]; b.title = FA[z - 1];
      b.addEventListener("click", function () { openSheet(z); });
      mem.appendChild(b);
    });
    $("sh-catnotes").hidden = true;
    $("sh-store").textContent = storeLabel();
    $("note-input").value = "";
    $("add-btn").disabled = true;
    setMsg("");
    renderNotes();
    sheet.hidden = false;
    sheet.querySelector(".panel").scrollTop = 0;
    document.body.style.overflow = "hidden";
    $("sh-close").focus();
  }
  function renderCatNotes(k) {
    var items = notes["cat-" + k] || [];
    $("sh-catnotes").hidden = !items.length;
    $("sh-catnotes-title").textContent = "نکته‌های " + CATS[k].name;
    var ul = $("sh-catnotes-list");
    ul.innerHTML = "";
    items.forEach(function (it) {
      var li = document.createElement("li");
      li.className = "nitem";
      var body = document.createElement("div"); body.className = "body";
      var t = document.createElement("div"); t.className = "txt"; t.textContent = it.text;
      body.appendChild(t); li.appendChild(body); ul.appendChild(li);
    });
  }
  function closeSheet() {
    sheet.hidden = true; sheetKey = null; armed = null;
    document.body.style.overflow = "";
    Object.keys(cellEls).forEach(function (k) { cellEls[k].setAttribute("aria-pressed", "false"); });
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  $("sh-close").addEventListener("click", closeSheet);
  $("backdrop").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });

  var dateFmt;
  try { dateFmt = new Intl.DateTimeFormat("fa-IR-u-ca-persian", { year: "numeric", month: "long", day: "numeric" }); } catch (e) { dateFmt = null; }

  function renderNotes() {
    var ul = $("sh-notes");
    ul.innerHTML = "";
    var key = sheetKey;
    var items = (key != null && notes[key]) || [];
    if (!items.length) {
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = "هنوز نکته‌ای برای " + titleFor(key) + " ننوشته‌ای. هر چیزی که بخواهی بعداً یادت بماند، پایین همین صفحه اضافه کن.";
      ul.appendChild(li);
      return;
    }
    items.forEach(function (it) {
      var li = document.createElement("li");
      li.className = "nitem";
      var body = document.createElement("div"); body.className = "body";
      var t = document.createElement("div"); t.className = "txt"; t.textContent = it.text;
      var w = document.createElement("div"); w.className = "when";
      w.textContent = dateFmt && it.t ? dateFmt.format(new Date(it.t)) : "";
      body.appendChild(t); body.appendChild(w);
      var d = document.createElement("button");
      d.type = "button"; d.className = "del" + (armed === it.id ? " sure" : "");
      d.textContent = armed === it.id ? "مطمئنی؟" : "حذف";
      d.addEventListener("click", function () {
        if (armed !== it.id) { armed = it.id; renderNotes(); return; }
        armed = null;
        notes[key] = (notes[key] || []).filter(function (x) { return x.id !== it.id; });
        refreshDots(); renderNotes(); persist(key);
      });
      li.appendChild(body); li.appendChild(d);
      ul.appendChild(li);
    });
  }

  $("note-input").addEventListener("input", function () {
    $("add-btn").disabled = !this.value.trim();
    setMsg("");
  });
  $("add-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var ta = $("note-input"), text = ta.value.trim();
    if (!text || sheetKey == null) return;
    var z = sheetKey;
    var item = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: text, t: Date.now() };
    notes[z] = (notes[z] || []).concat([item]);
    ta.value = ""; $("add-btn").disabled = true;
    refreshDots(); renderNotes(); persist(z);
  });

  startStore();
})();
</script>
</body>
</html>
